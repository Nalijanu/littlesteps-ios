<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta name="theme-color" content="#7856da"><title>LittleSteps — Learn & Play</title><meta name="description" content="Offline, ad-free learning activities for young children."><style>
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,system-ui,-apple-system,sans-serif;background:#f7f3ff;color:#2b2547}.app{max-width:560px;margin:auto;min-height:100dvh;padding:20px}.header{display:flex;align-items:center;justify-content:space-between;margin:3px 0 18px}.brand{font-size:25px;font-weight:900}.brand span{color:#8464e7}.pill{background:white;border-radius:50px;padding:10px 15px;font-weight:800;box-shadow:0 5px 18px #2d15500f}.hero{background:linear-gradient(125deg,#8868ed,#ab85fb);padding:25px;color:white;border-radius:28px;box-shadow:0 14px 35px #8964e73b}.hero h1{font-size:29px;margin:2px 0 8px}.hero p{margin:0;opacity:.94}.mascot{font-size:49px}.section{margin:25px 0 13px;font-size:19px;font-weight:900}.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:0;border-radius:24px;background:white;padding:17px 9px;text-align:center;box-shadow:0 7px 20px #4b2c7912;cursor:pointer;min-height:155px;color:inherit}.card .emoji{font-size:50px;display:block;margin-bottom:9px}.card strong{display:block;font-size:18px}.card small{display:block;color:#79728e;margin-top:4px}.foot{margin-top:25px;text-align:center;color:#817797;font-size:12px}.back{border:0;background:white;border-radius:14px;padding:11px 15px;font-weight:800;color:#6552b2;cursor:pointer}.gamehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.gamebox{background:white;border-radius:26px;padding:22px;box-shadow:0 8px 30px #4b2c7914;text-align:center}.gamebox h2{margin:7px 0 13px;font-size:24px}.prompt{font-size:21px;font-weight:850;line-height:1.4;min-height:60px}.visual{font-size:55px;min-height:79px;margin:12px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}.answer{min-height:96px;border:3px solid #e8e1fa;background:#faf8ff;border-radius:20px;font-size:28px;font-weight:900;cursor:pointer;color:#3d3359;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}.answer:active{transform:scale(.97)}.answer .shape{font-size:42px}.answer small{font-size:14px}.feedback{font-size:18px;min-height:45px;padding-top:16px;font-weight:900;color:#5b49a1}.progress{background:#eae4f8;border-radius:20px;height:11px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;background:#7dcb94;transition:width .2s}.continue{width:100%;padding:16px;border:0;border-radius:17px;background:#7758dd;color:white;font-size:18px;font-weight:900;cursor:pointer}.continue:disabled{background:#c9c1dc}.reward{text-align:center;background:white;border-radius:25px;padding:29px 20px}.reward .big{font-size:85px}.reward h2{font-size:27px}.note{background:#eee8fe;border-radius:18px;padding:13px;margin-top:18px;font-size:13px;color:#695b91;line-height:1.5}button:focus-visible{outline:4px solid #f8c55b;outline-offset:3px}
</style></head><body><main id="app" class="app"></main><script>
const app=document.getElementById('app');const lessons={colors:{name:'Colours',icon:'🎨',desc:'Find the colours',questions:[{p:'Which colour is RED?',a:['red','blue','yellow','green'],right:'red'},{p:'Which colour is BLUE?',a:['yellow','green','blue','red'],right:'blue'},{p:'Which colour is YELLOW?',a:['blue','red','green','yellow'],right:'yellow'},{p:'Which colour is GREEN?',a:['green','yellow','red','blue'],right:'green'},{p:'Which colour is PURPLE?',a:['pink','purple','blue','green'],right:'purple'}]},numbers:{name:'Numbers',icon:'🔢',desc:'Count together',questions:[{p:'How many apples do you see?',v:'🍎🍎',a:['1','2','3','4'],right:'2'},{p:'How many stars?',v:'⭐ ⭐ ⭐',a:['2','4','3','1'],right:'3'},{p:'How many ducks?',v:'🦆',a:['4','1','2','3'],right:'1'},{p:'How many balloons?',v:'🎈🎈🎈🎈',a:['3','2','4','5'],right:'4'},{p:'How many hearts?',v:'❤️❤️❤️❤️❤️',a:['4','6','3','5'],right:'5'}]},shapes:{name:'Shapes',icon:'🔺',desc:'Spot the shapes',questions:[{p:'Find the CIRCLE',a:['circle','square','triangle','star'],right:'circle'},{p:'Find the TRIANGLE',a:['square','triangle','star','circle'],right:'triangle'},{p:'Find the SQUARE',a:['star','circle','square','triangle'],right:'square'},{p:'Find the STAR',a:['circle','star','triangle','square'],right:'star'},{p:'Find the HEART',a:['heart','circle','square','triangle'],right:'heart'}]},animals:{name:'Animals',icon:'🐻',desc:'Meet friendly animals',questions:[{p:'Which animal says MEOW?',a:['🐶','🐱','🐮','🐸'],right:'🐱'},{p:'Which animal says WOOF?',a:['🐥','🐮','🐶','🐱'],right:'🐶'},{p:'Which animal says MOO?',a:['🐮','🦁','🐱','🐷'],right:'🐮'},{p:'Which animal says OINK?',a:['🐸','🐷','🐻','🐶'],right:'🐷'},{p:'Which animal says RIBBIT?',a:['🐱','🐮','🐸','🐥'],right:'🐸'}]}};
const shapes={circle:'●',square:'■',triangle:'▲',star:'★',heart:'♥'};const colors={red:'#f45f65',blue:'#4e95e8',yellow:'#f1c735',green:'#59bf86',purple:'#a474dc',pink:'#ed86bf'};let current=null,index=0,answered=false,stars=0,sessionCorrect=0;let speakEnabled=false;let stats={};try{stats=JSON.parse(localStorage.getItem('littlesteps-progress')||'{}')||{}}catch(e){stats={}}try{stars=Number(localStorage.getItem('littlesteps-stars')||0)}catch(e){}function save(){try{localStorage.setItem('littlesteps-stars',String(stars));localStorage.setItem('littlesteps-progress',JSON.stringify(stats))}catch(e){}}function speak(t){if(!speakEnabled||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;u.lang='en-AU';speechSynthesis.speak(u)}catch(e){}}
function home(){current=null;app.innerHTML=`<div class="header"><div class="brand">🌈 Little<span>Steps</span></div><div class="pill">⭐ <span id="stars">${stars}</span></div></div><div class="hero"><div class="mascot">🐻✨</div><h1>Ready to play?</h1><p>Little adventures for big learners!</p></div><div class="section">Pick an adventure</div><div class="cards">${Object.entries(lessons).map(([id,l])=>`<button class="card" data-topic="${id}"><span class="emoji">${l.icon}</span><strong>${l.name}</strong><small>${l.desc}</small></button>`).join('')}</div><div class="note">For ages approximately 3–6. No ads, accounts, external links, or data sharing. A grown-up can help younger learners.</div><div class="foot"><button class="back" id="parent" aria-label="Parent area">🔒 Grown-ups</button><br>Made for curious little minds 💜</div>`;app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start(b.dataset.topic));document.getElementById('parent').onclick=parentGate}
function start(id){current=id;index=0;sessionCorrect=0;renderQuestion()}function answerUI(a,id){if(id==='colors')return `<span style="height:44px;width:44px;border-radius:50%;background:${colors[a]};border:2px solid #0001"></span><small>${a}</small>`;if(id==='shapes')return `<span class="shape">${shapes[a]}</span><small>${a}</small>`;return a}
function renderQuestion(){answered=false;const l=lessons[current],q=l.questions[index];app.innerHTML=`<div class="gamehead"><button class="back" id="home">← Home</button><div class="pill">⭐ ${stars}</div></div><div class="gamebox"><div style="font-size:44px">${l.icon}</div><h2>${l.name}</h2><div style="font-size:13px;color:#837992">Question ${index+1} of ${l.questions.length}</div><div class="progress"><div style="width:${index/l.questions.length*100}%"></div></div><div class="prompt">${q.p}</div><button class="back" id="voice" style="margin-top:6px">${speakEnabled?"🔊 Read aloud: on":"🔇 Read aloud: off"}</button><div class="visual">${q.v||''}</div><div class="answers">${q.a.map((a,i)=>`<button class="answer" data-answer="${i}" aria-label="${a}">${answerUI(a,current)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="continue" id="next" disabled>${index===l.questions.length-1?'Finish':'Next →'}</button></div>`;document.getElementById('home').onclick=home;document.getElementById('voice').onclick=()=>{speakEnabled=!speakEnabled;document.getElementById('voice').textContent=speakEnabled?'🔊 Read aloud: on':'🔇 Read aloud: off';speak(q.p)};speak(q.p);app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>pick(q.a[Number(b.dataset.answer)]));document.getElementById('next').onclick=()=>{if(index===l.questions.length-1)finish();else{index++;renderQuestion()}}}
function pick(a){if(answered)return;const q=lessons[current].questions[index],ok=a===q.right;if(ok){answered=true;stars++;sessionCorrect++;stats[current]=(stats[current]||0)+1;save();speak("Well done!");document.getElementById('feedback').textContent='🎉 Fantastic! You got it!';document.getElementById('next').disabled=false;app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(q.a[Number(b.dataset.answer)]===q.right)b.style.borderColor='#67c990'});}else{document.getElementById('feedback').textContent='🌼 Try another one!';speak('Try another one')}}
function finish(){app.innerHTML=`<div class="reward"><div class="big">🏆</div><h2>Superstar!</h2><p>You completed <b>${lessons[current].name}</b>!</p><p>You earned ${sessionCorrect} stars this round! ⭐</p><p>Keep learning, keep shining! ✨</p><button class="continue" id="again">Play another adventure</button></div>`;document.getElementById('again').onclick=home}
function parentGate(){const a=2+Math.floor(Math.random()*6),b=2+Math.floor(Math.random()*6);app.innerHTML=`<div class="gamehead"><button class="back" id="return">← Back</button></div><div class="gamebox"><div style="font-size:48px">🔒</div><h2>Grown-up check</h2><p>Please ask a grown-up to answer:</p><p style="font-size:28px;font-weight:900">What is ${a} + ${b}?</p><label for="gateanswer">Answer</label><br><input id="gateanswer" inputmode="numeric" type="number" style="font-size:22px;padding:14px;width:160px;border:2px solid #d7cbed;border-radius:12px"><p id="gatemsg" aria-live="polite"></p><button class="continue" id="unlock">Continue</button></div>`;document.getElementById('return').onclick=home;document.getElementById('unlock').onclick=()=>{if(Number(document.getElementById('gateanswer').value)===a+b)parentArea();else document.getElementById('gatemsg').textContent='Please ask a grown-up for help.'}}
function parentArea(){const list=Object.entries(lessons).map(([key,item])=>`<p style="display:flex;justify-content:space-between"><span>${item.icon} ${item.name}</span><strong>${stats[key]||0} correct answers</strong></p>`).join('');app.innerHTML=`<div class="gamehead"><button class="back" id="return">← Home</button><div class="pill">Parent area</div></div><div class="gamebox" style="text-align:left"><h2>Learning progress</h2><p>Stars collected: <b>${stars}</b></p>${list}<div class="note">Progress is saved only on this device. There are no accounts, ads, analytics, network calls, or AI chat. Read-aloud uses device speech synthesis when available.</div><h3>Privacy</h3><p>No personal information is requested. Game scores remain in local device storage and are never sent to us. Uninstalling or clearing app data removes them.</p><button class="back" id="clear" style="color:#a02f59">Reset all progress</button><p id="resetmsg" aria-live="polite"></p></div>`;document.getElementById('return').onclick=home;document.getElementById('clear').onclick=()=>{if(confirm('Delete all stars and progress from this device?')){stars=0;stats={};save();parentArea();document.getElementById('resetmsg').textContent='Progress reset.'}}}
home();
</script></body></html>
