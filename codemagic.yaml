workflows:
  littlesteps-ios-testflight:
    name: LittleSteps iOS signed build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: littlesteps-codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.littlesteps.learnplay
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install app dependencies
        script: npm install
      - name: Generate iOS project on cloud Mac
        script: npx cap add ios
      - name: Update iOS native assets
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Apply App Store signing
        script: xcode-project use-profiles
      - name: Set build version
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
          agvtool new-marketing-version 1.1.0
      - name: Generate signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
